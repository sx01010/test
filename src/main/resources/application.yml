spring:
  application:
    name: mathematics

  # 默认 profile 用落盘的 H2，clone 下来 mvn spring-boot:run 就能直接跑通刷题闭环。
  # 用文件而不是内存，是为了让账号、登录令牌和做题记录活过重启：令牌存在 auth_token 表里，
  # 库一没了连用户行都不在，前端存着的令牌自然就失效，每次重启都得重新登录。
  # 库文件在 data/ 下，想从干净状态重来就删掉整个目录。
  # 正式环境用 -Dspring.profiles.active=mysql 切到 MySQL 8。
  #
  # 集成测试不吃这个地址：它们在 @SpringBootTest(properties = ...) 里各自钉了内存库，
  # 否则测试数据会往开发库里累积，那些「恰好 N 条」的断言第二次就挂了。
  datasource:
    url: jdbc:h2:file:./data/mathematics;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,YEAR,VALUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  flyway:
    # {vendor} 解析成 h2 或 mysql：题干全文索引、JSON 列、生成列只在 MySQL 脚本里。
    # 开发 profile 额外挂 seed 目录，灌入知识点树与 5 道示例题。
    locations: classpath:db/migration/{vendor},classpath:db/seed/{vendor}

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

mathematics:
  practice:
    # R12：连续做对几次自动标记已掌握，规格要求做成配置项
    mastery-threshold: 2
  auth:
    access-token-ttl: PT2H
    refresh-token-ttl: P30D
    max-login-failures: 5
    lock-duration: PT15M
    # R20 找回密码：规格要求验证码 10 分钟失效、同一账号 1 分钟内只发一次
    reset-code-ttl: PT10M
    reset-code-cooldown: PT1M
    # 规格没提这条，但它比有效期更要紧：六位数字能无限猜的话，10 分钟够轮询完
    reset-max-attempts: 5
    # V1 没有邮件与短信通道，验证码只能打到日志供开发自测。mysql profile 里关掉。
    # 绝不放进响应体：那样任何人都能拿别人的邮箱要码然后直接改密码。
    log-reset-codes: true
  dev:
    # 开发环境自动建一个演示账号 demo@mathematics.local / demo12345
    seed-demo-user: true
  material:
    # R21–R23：V1 没有对象存储，资料文件写本地目录（和 H2 库文件一样在 data/ 下，不进版本库）
    storage-dir: ./data/materials
    # 规格要求签名地址 5 分钟失效
    download-ttl: PT5M
    upload-ttl: PT15M
    # 30 MB，和 material_file 的 CHECK 约束一致
    max-size-bytes: 31457280
    # 留空则启动时随机生成一把并打 WARN。不给硬编码默认值：写在仓库里的密钥等于没有签名。
    signing-secret: ${MATERIAL_SIGNING_SECRET:}

  rate-limit:
    enabled: true
    # 单机开发用内存计数；mysql profile 切到 redis
    store: memory
    trust-forwarded-for: false

management:
  health:
    # 默认 profile 不连 Redis，别让健康检查因为一个没用到的组件报 DOWN
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.mathematics: INFO
