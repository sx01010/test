spring:
  application:
    name: mathematics

  # 默认 profile 用落盘的 H2，clone 下来 mvn spring-boot:run 就能直接跑通刷题闭环。
  # 用文件而不是内存，是为了让账号、登录令牌和做题记录活过重启：令牌存在 auth_token 表里，
  # 库一没了连用户行都不在，前端存着的令牌自然就失效，每次重启都得重新登录。
  # 库文件在 data/ 下，想从干净状态重来就删掉整个目录。
  # 正式环境用 -Dspring.profiles.active=mysql 切到 MySQL 8。
  #
  # 集成测试不吃这个地址：它们在 @SpringBootTest(properties = ...) 里各自钉了内存库，
  # 否则测试数据会往开发库里累积，那些「恰好 N 条」的断言第二次就挂了。
  datasource:
    url: jdbc:h2:file:./data/mathematics;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,YEAR,VALUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  flyway:
    # {vendor} 解析成 h2 或 mysql：题干全文索引、JSON 列、生成列只在 MySQL 脚本里。
    # 开发 profile 额外挂 seed 目录，灌入知识点树与 5 道示例题。
    locations: classpath:db/migration/{vendor},classpath:db/seed/{vendor}

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

mathematics:
  practice:
    # R12：连续做对几次自动标记已掌握，规格要求做成配置项
    mastery-threshold: 2
  auth:
    access-token-ttl: PT2H
    refresh-token-ttl: P30D
    max-login-failures: 5
    lock-duration: PT15M
  dev:
    # 开发环境自动建一个演示账号 demo@mathematics.local / demo12345
    seed-demo-user: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.mathematics: INFO
