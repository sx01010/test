spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:mathematics}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USER:mathematics}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    # 生产不挂 seed，示例题只在开发环境出现
    locations: classpath:db/migration/mysql

mathematics:
  dev:
    seed-demo-user: false
