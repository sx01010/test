spring:
  datasource:
    # characterEncoding 要的是 Java 字符集名，不是 MySQL 的字符集族名：写 utf8mb4 会让
    # Connector/J 在解析连接参数时就抛 UnsupportedEncodingException，连 TCP 都建不起来。
    # 库本身是 utf8mb4，驱动从 8.0 起会把 UTF-8 映射到服务端的 utf8mb4。
    # 时区参数在 Connector/J 9.x 叫 connectionTimeZone，serverTimezone 是旧名。
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:mathematics}?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USER:mathematics}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms

  flyway:
    # 默认挂 seed：本地用 MySQL 当持久化开发库时，题库不能是空的。
    # 正式环境把 FLYWAY_LOCATIONS 设成 classpath:db/migration/mysql，示例题就不会进去。
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/mysql,classpath:db/seed/mysql}
    # 同默认 profile：开发库跑过 V90 种子后还要能补 V8 之后的结构迁移
    out-of-order: true

mathematics:
  auth:
    # 验证码不能进正式环境的日志：运维、日志采集、报错平台都能看到，等于给所有账号留了后门。
    # 接上真实邮件或短信通道之前，这个 profile 下的找回密码功能实际不可用。
    log-reset-codes: false
  rate-limit:
    # 多实例共享计数。Redis 挂掉时限流放行而不是拒绝，见 RedisRateLimiter
    store: ${RATE_LIMIT_STORE:redis}
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  dev:
    # 这个 profile 也给正式环境用，所以不在这里造已知密码的管理员账号。
    # 第一个管理员靠手工提权：UPDATE `user` SET role = 'ADMIN' WHERE email = '你的邮箱';
    seed-demo-user: false

management:
  health:
    redis:
      enabled: true
