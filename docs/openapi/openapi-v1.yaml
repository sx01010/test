          type: string
          minLength: 64
          maxLength: 64

    UploadTicketResponse:
      type: object
      required: [objectKey, uploadUrl, expiresAt]
      properties:
        objectKey:
          type: string
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    UpsertMaterialRequest:
      type: object
      required: [title, type, originType, objectKey]
      properties:
        title:
          type: string
          maxLength: 200
        type:
          $ref: '#/components/schemas/MaterialType'
        grade:
          type: string
        year:
          type: integer
        originType:
          $ref: '#/components/schemas/MaterialOriginType'
        licenseRef:
          type: string
        sourceUrl:
          type: string
        objectKey:
          type: string
        publish:
          type: boolean
          default: false

    UpsertMaterialResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        status:
