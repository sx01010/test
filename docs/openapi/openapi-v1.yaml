    MaterialSummary:
      type: object
      required: [id, title, type, originType]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        type:
          $ref: '#/components/schemas/MaterialType'
        grade:
          type: string
        year:
          type: integer
        originType:
          $ref: '#/components/schemas/MaterialOriginType'

    MaterialSummaryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialSummary'
